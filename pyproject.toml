[project]
name = "ichatbio-gget-agent"
version = "1"
requires-python = ">=3.12"
dependencies = [
    "ichatbio-sdk==0.2.8",
    "openai>=1.109.1",
    "pydantic>=2.13.4",
    "instructor>=1.11.3",
    "dotenv>=0.9.9",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0a1",
    "starlette>=0.47.3",
    "uvicorn>=0.34.3",
    "genson>=1.3.0",
    "jq>=1.10.0",
    "pytest_httpx>=0.35.0",
    "langchain>=1.3.4",
    "langchain_openai>=1.2.2",
    "ruff>=0.15.4",
    "contextvars>=2.4",
    "black>=26.3.0",
    "gget>=0.30.8",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
log_cli = true
log_cli_level = "INFO"

[dependency-groups]
dev = [
    "deepeval>=4.3.1",
    "pytest>=8.3.5",
    "pyyaml>=6.0.3",
]
